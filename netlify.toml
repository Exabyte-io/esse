# Deploy previews for the published site (schemas.mat3ra.com is served from GitHub Pages
# off `dev`; Netlify previews any branch or pull request from the same build).
[build]
  command = "npm run build-site"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

# The explorer, docs and map are static; the JSON beside them is data the client fetches at
# runtime — files.json on every load, graph.json for the map, views.json for the two category
# views — and all of it is rebuilt on every deploy. One rule so a fourth asset cannot be
# forgotten, as files.json was.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
